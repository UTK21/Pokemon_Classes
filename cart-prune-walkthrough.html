<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AST Pruner — Cart.jsx End-to-End Walkthrough</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#30363d;
    --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950;
    --red:#f85149; --yellow:#d29922; --purple:#bc8cff;
    --keep-bg:rgba(63,185,80,.12); --strip-bg:rgba(248,81,73,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.55;
  }
  header.top{
    padding:18px 26px; border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#161b22,#0d1117);
  }
  header.top h1{margin:0;font-size:20px}
  header.top p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .layout{display:flex;min-height:calc(100vh - 140px)}
  /* LEFT: persistent data-flow pipeline */
  .rail{
    width:300px;flex-shrink:0;border-right:1px solid var(--border);
    background:var(--panel);padding:18px 14px;position:sticky;top:0;height:fit-content;
  }
  .rail h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px 6px}
  .stage{
    display:flex;gap:10px;padding:9px 10px;border-radius:8px;margin-bottom:4px;
    font-size:13px;color:var(--muted);position:relative;transition:.2s;
  }
  .stage .dot{
    width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;
  }
  .stage .lbl{padding-top:1px}
  .stage .sub{display:block;font-size:11px;color:#6e7681}
  .stage.active{background:var(--panel2);color:var(--text)}
  .stage.active .dot{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:700}
  .stage.done .dot{background:var(--green);border-color:var(--green);color:#0d1117}
  .stage.done{color:#768390}
  .rail .connector{height:8px;width:1px;background:var(--border);margin-left:20px}
  /* MAIN */
  main{flex:1;padding:26px 34px;max-width:900px}
  .stepwrap{display:none;animation:fade .25s ease}
  .stepwrap.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
  h2.steptitle{margin:6px 0 14px;font-size:24px}
  .explain{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);
    padding:14px 16px;border-radius:8px;margin:14px 0;font-size:14.5px}
  .explain b{color:#fff}
  .note{font-size:13px;color:var(--muted);margin:10px 0}
  .eli5{background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.3);border-radius:8px;
    padding:12px 14px;margin:14px 0;font-size:13.5px}
  .eli5 strong{color:var(--yellow)}
  /* code */
  .codecols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
  @media(max-width:820px){.codecols{grid-template-columns:1fr}}
  .codebox{background:#0a0d12;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .codebox .cap{padding:7px 12px;font-size:12px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;background:var(--panel)}
  .codebox .cap .tok{font-variant-numeric:tabular-nums}
  .codebox pre{margin:0;padding:12px 14px;overflow:auto;font-size:12.5px;line-height:1.5;
    font-family:"SF Mono",Menlo,Consolas,monospace;max-height:420px}
  .badge{font-size:10.5px;padding:2px 7px;border-radius:20px;font-weight:700}
  .badge.keep{background:var(--keep-bg);color:var(--green)}
  .badge.strip{background:var(--strip-bg);color:var(--red)}
  .badge.sig{background:rgba(88,166,255,.12);color:var(--accent)}
  .ln-keep{display:block;background:var(--keep-bg)}
  .ln-strip{display:block;background:var(--strip-bg);color:#8b949e;text-decoration:line-through;text-decoration-color:#f8514966}
  .ln-sig{display:block;background:rgba(88,166,255,.10)}
  .tok-pill{font-variant-numeric:tabular-nums;font-weight:700}
  .arrow{text-align:center;font-size:22px;color:var(--muted);margin:6px 0}
  /* metric cards */
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 18px;flex:1;min-width:140px}
  .card .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .card .k{font-size:12px;color:var(--muted);margin-top:2px}
  .card.good .v{color:var(--green)}
  .filerow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);
    border-radius:8px;margin:8px 0;background:var(--panel);font-size:13px}
  .filerow .nm{flex:1;font-family:"SF Mono",Menlo,monospace;font-size:12.5px}
  .bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;flex:1.4;min-width:90px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#2ea043)}
  .pct{width:58px;text-align:right;font-variant-numeric:tabular-nums;color:var(--green);font-weight:700}
  /* nav */
  .nav{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;
    padding:14px 34px;border-top:1px solid var(--border);background:var(--panel);}
  .nav button{background:var(--accent);color:#0d1117;border:0;padding:9px 20px;border-radius:7px;
    font-weight:700;font-size:14px;cursor:pointer}
  .nav button:disabled{background:var(--panel2);color:#484f58;cursor:not-allowed}
  .nav button.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .counter{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:10px 0 0;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  kbd{background:var(--panel2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;
    padding:1px 6px;font-size:12px;font-family:monospace}
  code.inline{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12.5px;font-family:monospace}
</style>
</head>
<body>

<header class="top">
  <h1>🪓 AST Pruner — End-to-End Walkthrough</h1>
  <p>Example scenario: pruning <code class="inline">pages/Cart.jsx</code> (and the files it imports) before sending it to an AI chat. Use <kbd>←</kbd> / <kbd>→</kbd> or the buttons.</p>
</header>

<div class="layout">
  <!-- LEFT RAIL: the data-flow pipeline, always visible -->
  <aside class="rail">
    <h3>Data-flow pipeline</h3>
    <div id="rail"></div>
    <div class="legend" style="margin-top:18px">
      <span><i class="sw" style="background:var(--keep-bg);border:1px solid var(--green)"></i> kept (full body)</span>
      <span><i class="sw" style="background:rgba(88,166,255,.12);border:1px solid var(--accent)"></i> signature only</span>
      <span><i class="sw" style="background:var(--strip-bg);border:1px solid var(--red)"></i> stripped</span>
    </div>
  </aside>

  <!-- MAIN: the step content -->
  <main id="main"><!-- steps injected by JS --></main>
</div>

<div class="nav">
  <button class="ghost" id="back">← Back</button>
  <div class="counter" id="counter"></div>
  <button id="next">Next →</button>
</div>

<script>
/* ============================================================
   Each step maps to a pipeline stage (left rail) and renders
   explanatory HTML on the right. Real data from:
   ast-pruner prune pages/Cart.jsx --depth 3
   baseline 1823 tok -> pruned 672 tok  (63.14% saved, 4 files)
   ============================================================ */

const STAGES = [
  {id:"ask",  lbl:"You ask @pruner",      sub:"#file:Cart.jsx"},
  {id:"wake", lbl:"Extension wakes",      sub:"finds file + symbols"},
  {id:"cli",  lbl:"CLI spawned",          sub:"tree-sitter → AST"},
  {id:"entry",lbl:"Entry file kept",      sub:"full bodies"},
  {id:"trace",lbl:"Imports traced",       sub:"depth = 3"},
  {id:"sig",  lbl:"Deps → signatures",    sub:"bodies stripped"},
  {id:"stream",lbl:"Streamed to chat",    sub:"stream.markdown"},
  {id:"model",lbl:"Model sees pruned",    sub:"tokens saved here"},
  {id:"done", lbl:"Result",               sub:"1823 → 672"},
];

/* helper to build a code box */
function box(cap, tok, badge, bodyHTML){
  return `<div class="codebox">
    <div class="cap"><span>${cap} ${badge||""}</span><span class="tok">${tok}</span></div>
    <pre>${bodyHTML}</pre></div>`;
}

const STEPS = [
/* 0 ── THE SCENARIO ───────────────────────────────────────── */
{stage:"ask", html:`
  <div class="kicker">The scenario</div>
  <h2 class="steptitle">You want AI help with <code class="inline">Cart.jsx</code></h2>
  <div class="explain">Imagine you're working on the shopping-cart page of a React app and you ask
  an AI assistant: <b>“explain how this Cart works.”</b> To answer well, the AI needs to see
  <code class="inline">Cart.jsx</code> <b>and</b> the files it imports — otherwise names like
  <code class="inline">CommonSection</code>, <code class="inline">Helmet</code>, and
  <code class="inline">cartActions</code> are mysteries.</div>

  <div class="eli5"><strong>ELI5:</strong> Think of <code class="inline">Cart.jsx</code> as the page you're reading,
  and its imports as 3 reference books it points to. Normally you'd photocopy <em>all</em> the books in full and
  hand the whole stack to the AI. That's a lot of paper (= a lot of tokens = $$). The pruner photocopies the page
  in full, but for the reference books it only copies the <em>table of contents</em> — usually that's all the AI needs.</div>

  <div class="note">Here's the naïve cost if you pasted everything in full:</div>
  <div class="cards">
    <div class="card"><div class="v">4</div><div class="k">files involved</div></div>
    <div class="card"><div class="v">1,823</div><div class="k">tokens if pasted in full</div></div>
    <div class="card"><div class="v">~$$</div><div class="k">every time you ask</div></div>
  </div>
  <div class="note">Over a long chat you re-send this on every turn. The pruner's job: send the
  <b>same meaning</b> in far fewer tokens. Click <b>Next</b> to follow the data.</div>
`},

/* 1 ── INVOKE ─────────────────────────────────────────────── */
{stage:"ask", html:`
  <div class="kicker">Step 1 · Input</div>
  <h2 class="steptitle">You type the request</h2>
  ${box("VS Code Copilot Chat", "", "", `<span class="ln-keep">@pruner #file:pages/Cart.jsx</span>`)}
  <div class="explain"><b>@pruner</b> is a <b>chat participant</b> — a helper you summon with <code class="inline">@</code>.
  <b>#file:</b> attaches a file to the message. That's the entire user action.</div>
  <div class="eli5"><strong>What just happened technically:</strong> VS Code packages your message into a
  <code class="inline">request</code> object. The attached file shows up in <code class="inline">request.references</code>,
  and the text (<code class="inline">@pruner …</code>) is the prompt. Nothing has been pruned yet — this is just the ask.</div>
`},

/* 2 ── EXTENSION WAKES ────────────────────────────────────── */
{stage:"wake", html:`
  <div class="kicker">Step 2 · The extension wakes up</div>
  <h2 class="steptitle">Find the file, read the options</h2>
  <div class="explain">VS Code loads the AST Pruner extension (only now — “lazy activation”) and runs its handler.
  The handler does three quick things before any pruning:</div>
  <div class="filerow"><span class="badge keep">1</span><span class="nm">Filter <code class="inline">request.references</code> → the real file URI for <b>Cart.jsx</b></span></div>
  <div class="filerow"><span class="badge keep">2</span><span class="nm">Parse <code class="inline">--symbols</code> from the prompt → here: <b>none given</b>, so prune keeps the file's top-level symbols</span></div>
  <div class="filerow"><span class="badge keep">3</span><span class="nm">Read settings → <code class="inline">defaultDepth = 3</code> (how far to follow imports)</span></div>
  <div class="eli5"><strong>ELI5:</strong> The assistant picks up your page, notes “follow references up to 3 hops deep,”
  and gets ready to call the specialist tool that does the actual shrinking. The extension itself is <b>not</b> smart —
  it's a coordinator. The intelligence is in the CLI it's about to run.</div>
`},

/* 3 ── CLI + AST ──────────────────────────────────────────── */
{stage:"cli", html:`
  <div class="kicker">Step 3 · The brain — a local Python CLI</div>
  <h2 class="steptitle">tree-sitter turns code into a tree (AST)</h2>
  <div class="explain">The extension launches the <code class="inline">ast-pruner</code> CLI as a separate program and hands it the file path.
  <b>No AI is involved here.</b> The CLI uses <b>tree-sitter</b> to parse the code into an
  <b>Abstract Syntax Tree (AST)</b> — a structured map of every function, import, and statement.</div>

  <div class="codecols">
    ${box("Raw code (what tree-sitter reads)", "text", "", `<span class="ln-keep">const Tr = (props) => {</span>
<span class="ln-keep">  const { id, title } = props.item;</span>
<span class="ln-keep">  const deleteItem = () => {...}</span>
<span class="ln-keep">  return ( &lt;tr&gt;...&lt;/tr&gt; );</span>
<span class="ln-keep">};</span>`)}
    ${box("AST (how the CLI sees it)", "tree", "", `function_declaration  "Tr"
 ├─ params: (props)
 ├─ variable: id, title
 ├─ function: deleteItem
 └─ return: JSXElement &lt;tr&gt;`)}
  </div>

  <div class="eli5"><strong>Why a tree?</strong> Because once code is a tree, the pruner can reason about it precisely:
  “this is a function <em>definition</em>,” “this is just an <em>import</em>,” “this is the function <em>body</em>.”
  It can then keep or drop whole branches safely — like trimming branches off a real tree without hurting the trunk.
  This is the same technology editors use for syntax highlighting, so it's reliable and deterministic
  (<b>same input → same output, every time</b>).</div>
`},

/* 4 ── ENTRY FILE KEPT ────────────────────────────────────── */
{stage:"entry", html:`
  <div class="kicker">Step 4 · The file you care about</div>
  <h2 class="steptitle">Cart.jsx is kept (almost) in full</h2>
  <div class="explain">Cart.jsx is the <b>entry file</b> — the one you actually asked about. The pruner keeps its
  <b>full function bodies</b>, because you need to read and discuss this code. Only truly unused bits are trimmed.</div>

  ${box("pages/Cart.jsx", '<span class="tok-pill">658 → 637 tok</span>', '<span class="badge keep">kept · full body</span>', `<span class="ln-keep">const Cart = () => {</span>
<span class="ln-keep">  const cartItems = useSelector(s =&gt; s.cart.cartItems);</span>
<span class="ln-keep">  const totalAmount = useSelector(s =&gt; s.cart.totalAmount);</span>
<span class="ln-keep">  return ( &lt;Helmet title="Cart"&gt; ... &lt;/Helmet&gt; );</span>
<span class="ln-keep">};</span>
<span class="ln-keep">const Tr = (props) => { ...full body kept... };</span>`)}

  <div class="note">Only a ~3% trim here (658 → 637) — and that's expected.</div>
  <div class="eli5"><strong>ELI5:</strong> This is the page you're studying, so you keep every word.
  The big savings won't come from this file — they come from the <em>reference books</em> it imports. Next →</div>
`},

/* 5 ── TRACE IMPORTS ──────────────────────────────────────── */
{stage:"trace", html:`
  <div class="kicker">Step 5 · Following the imports</div>
  <h2 class="steptitle">Which files does Cart.jsx depend on?</h2>
  <div class="explain">The CLI reads Cart.jsx's <code class="inline">import</code> lines and follows them, up to
  <b>depth 3</b>. It discovers <b>3 dependency files</b> that Cart relies on:</div>

  ${box("pages/Cart.jsx — import lines", "", "", `<span class="ln-keep">import CommonSection from "../components/UI/common-section/CommonSection";</span>
<span class="ln-keep">import Helmet from "../components/Helmet/Helmet";</span>
<span class="ln-keep">import { cartActions } from "../store/shopping-cart/cartSlice";</span>
<span style="color:#6e7681">// (react-redux, reactstrap, react-router-dom = external libs, not traced)</span>`)}

  <div class="filerow"><span class="nm">components/UI/common-section/CommonSection.jsx</span><span class="badge sig">dependency</span></div>
  <div class="filerow"><span class="nm">components/Helmet/Helmet.js</span><span class="badge sig">dependency</span></div>
  <div class="filerow"><span class="nm">store/shopping-cart/cartSlice.js</span><span class="badge sig">dependency · 1,033 tok 😮</span></div>

  <div class="eli5"><strong>ELI5:</strong> Cart points at 3 of your own files. (It also imports React libraries like
  <code class="inline">reactstrap</code>, but those aren't your code, so the pruner leaves them alone.)
  Notice <code class="inline">cartSlice.js</code> is <b>huge</b> — 1,033 tokens of cart logic. Watch what happens to it next.</div>
`},

/* 6 ── SIGNATURES (the magic) ─────────────────────────────── */
{stage:"sig", html:`
  <div class="kicker">Step 6 · The key idea — keep the “shape”, drop the “how”</div>
  <h2 class="steptitle">Dependencies collapse to signatures</h2>
  <div class="explain">For imported files, the AI usually just needs to know <b>what exists</b> (the names and shapes),
  not <b>how it works inside</b>. So the pruner keeps the <b>signature</b> and replaces the body with
  <code class="inline">{}</code>. Here is each dependency, <b>before → after</b>:</div>

  <div class="codecols">
    ${box("CommonSection.jsx", '<span class="tok-pill">86 tok</span>', '<span class="badge strip">before</span>', `<span class="ln-strip">import React from "react";</span>
<span class="ln-keep">import { Container } from "reactstrap";</span>
<span class="ln-strip">import "../../../styles/common-section.css";</span>
<span class="ln-sig">const CommonSection = (props) => {</span>
<span class="ln-strip">  return (&lt;section&gt;&lt;Container&gt;</span>
<span class="ln-strip">    &lt;h2&gt;{props.title}&lt;/h2&gt;</span>
<span class="ln-strip">  &lt;/Container&gt;&lt;/section&gt;);</span>
<span class="ln-sig">};</span>`)}
    ${box("CommonSection.jsx", '<span class="tok-pill">19 tok</span>', '<span class="badge sig">after · signature</span>', `<span class="ln-keep">import { Container } from "reactstrap";</span>

<span class="ln-sig">const CommonSection = (props) => {};</span>`)}
  </div>

  <div class="codecols">
    ${box("Helmet.js", '<span class="tok-pill">46 tok</span>', '<span class="badge strip">before</span>', `<span class="ln-strip">import React from "react";</span>
<span class="ln-sig">const Helmet = (props) => {</span>
<span class="ln-strip">  document.title = "My Pizza -" + props.title;</span>
<span class="ln-strip">  return &lt;div&gt;{props.children}&lt;/div&gt;;</span>
<span class="ln-sig">};</span>`)}
    ${box("Helmet.js", '<span class="tok-pill">7 tok</span>', '<span class="badge sig">after · signature</span>', `<span class="ln-sig">const Helmet = (props) => {};</span>`)}
  </div>

  <div class="arrow">⬇ the headline example ⬇</div>
  <div class="codecols">
    ${box("cartSlice.js (146 lines!)", '<span class="tok-pill">1,033 tok</span>', '<span class="badge strip">before</span>', `<span class="ln-strip">const items = localStorage.getItem(...) ...</span>
<span class="ln-strip">const totalAmount = localStorage.getItem(...) ...</span>
<span class="ln-strip">const setItemFunc = (item,a,q) => {...}</span>
<span class="ln-strip">const cartSlice = createSlice({</span>
<span class="ln-strip">  reducers: {</span>
<span class="ln-strip">    addItem(state, action) { ...30 lines... }</span>
<span class="ln-strip">    removeItem(state, action) { ...20 lines... }</span>
<span class="ln-strip">    deleteItem(state, action) { ...15 lines... }</span>
<span class="ln-strip">  }</span>
<span class="ln-strip">});</span>
<span class="ln-sig">export const cartActions = cartSlice.actions;</span>`)}
    ${box("cartSlice.js", '<span class="tok-pill">9 tok</span>', '<span class="badge sig">after · 99.1% gone</span>', `<span class="ln-sig">const cartActions = cartSlice.actions;</span>`)}
  </div>

  <div class="eli5"><strong>This is the whole point.</strong> Cart.jsx only does
  <code class="inline">cartActions.deleteItem(id)</code> — it just needs to know <code class="inline">cartActions</code>
  <em>exists</em>. It does <b>not</b> need the 130 lines of reducer logic inside cartSlice. So 1,033 tokens become 9.
  Like keeping a book's title and tossing the chapters you won't read.</div>
`},

/* 7 ── STREAM TO CHAT ─────────────────────────────────────── */
{stage:"stream", html:`
  <div class="kicker">Step 7 · Handing the result back</div>
  <h2 class="steptitle">Pruned code is written into the chat</h2>
  <div class="explain">The CLI returns all 4 pruned files as JSON. The extension writes them into the chat reply with a single
  call — <code class="inline">stream.markdown(prunedSource)</code>. <b>This is the pivotal moment:</b> the small code now lives in
  the <b>conversation history</b>.</div>

  ${box("What appears in Copilot Chat", '<span class="tok-pill">672 tok total</span>', '<span class="badge keep">conversation buffer</span>', `<span class="ln-keep">pages/Cart.jsx (637 tok) ──────── full body</span>
<span class="ln-sig">CommonSection.jsx (19 tok) ────── signature only</span>
<span class="ln-sig">Helmet.js (7 tok) ─────────────── signature only</span>
<span class="ln-sig">cartSlice.js (9 tok) ──────────── signature only</span>

<span style="color:#6e7681">Saved 1,151 tokens (63.1% reduction) across 4 files.</span>`)}

  <div class="eli5"><strong>Important:</strong> the pruner does <b>NOT</b> call any AI model and does <b>NOT</b> send your code over the
  internet. It only places the pruned text into the chat conversation, like pasting it for you — but the small version.</div>
`},

/* 8 ── MODEL SEES PRUNED ──────────────────────────────────── */
{stage:"model", html:`
  <div class="kicker">Step 8 · Where the saving actually happens</div>
  <h2 class="steptitle">The model receives the pruned version</h2>
  <div class="explain">On the <b>next turn</b>, Copilot (or whichever model you've selected) builds its request from the
  conversation history — which now holds the <b>pruned</b> code. So the model is billed for <b>672 tokens, not 1,823</b>.
  The savings are real because the conversation itself got smaller.</div>

  <div class="codecols">
    ${box("Without pruner", '<span class="tok-pill" style="color:var(--red)">1,823 tok</span>', '<span class="badge strip">sent to model</span>', `<span class="ln-strip">Cart.jsx ............ 658</span>

/* ---- render + navigation ---- */
let i = 0;
const main = document.getElementById("main");
const railEl = document.getElementById("rail");
const counter = document.getElementById("counter");
const backB = document.getElementById("back");
const nextB = document.getElementById("next");

main.innerHTML = STEPS.map((s,idx)=>`<div class="stepwrap" data-i="${idx}">${s.html}</div>`).join("");

function renderRail(){
  const activeStage = STEPS[i].stage;
  let activeReached = false;
  railEl.innerHTML = STAGES.map((st,idx)=>{
    // determine if this stage is done/active/future based on first step that uses it
    const firstStepForStage = STEPS.findIndex(x=>x.stage===st.id);
    const isActive = st.id===activeStage;
    const isDone = firstStepForStage < (STEPS.findIndex(x=>x.stage===activeStage)) && !isActive;
    const cls = isActive ? "active" : (isDone ? "done" : "");
    const mark = isDone ? "✓" : (idx+1);
    const conn = idx<STAGES.length-1 ? '<div class="connector"></div>' : '';
    return `<div class="stage ${cls}"><span class="dot">${mark}</span>
      <span class="lbl">${st.lbl}<span class="sub">${st.sub}</span></span></div>${conn}`;
  }).join("");
}

function show(){
  document.querySelectorAll(".stepwrap").forEach(el=>{
    el.classList.toggle("show", +el.dataset.i===i);
  });
  counter.textContent = `Step ${i+1} of ${STEPS.length}`;
  backB.disabled = i===0;
  nextB.textContent = i===STEPS.length-1 ? "Restart ↺" : "Next →";
  renderRail();
  window.scrollTo({top:0,behavior:"smooth"});
}
backB.onclick = ()=>{ if(i>0){i--;show();} };
nextB.onclick = ()=>{ i = i===STEPS.length-1 ? 0 : i+1; show(); };
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") nextB.click();
  if(e.key==="ArrowLeft") backB.click();
});
show();
</script>
